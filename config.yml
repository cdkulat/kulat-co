baseURL: "https://kulat.co/" # if your site is in 'https', then make sure your base url isn't written using 'http' otherwise your sitemap would contain http (as opposeed to https) URLs. This would affect Google indexing of your URLs.
title: "kulat.co"
paginate: 5
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
# googleAnalytics: UA-123-45

minify:
    disableXML: true
    # minifyOutput: true


params:
        env: production
        languageName: "English"
        weight: 1
        taxonomies:
          category: categories
          tag: tags
          series: series
        homeInfoParams:
          Title: "Hey, I'm Christian."
          Content: >
            I'm a Senior IT Analyst and software engineer in Atlanta, and this is my blog and portfolio.

            - I post things I've learned, tidbits of code, and the projects I'm working on.

            - The most recent posts are below. You can also browse my [projects](/projects/) or my [resume](/resume/).

            - Have a question or an idea? Visit the contact page!
        socialIcons:
          - name: github
            url: "https://github.com/cdkulat"
          - name: linkedin
            url: "https://linkedin.com/in/cdkulat"
          - name: discord
            url: "https://discord.com/users/165252741050925057"
menu:
  main:
    - name: About
      url: "/about"
      weight: 5
    - name: Contact
      url: "/contact"
      weight: 10
    - name: Resume
      url: "/resume"
      weight: 10